runs:
  [1]
path:
  log_dir: ./logs

  load_dir: data/example/raw_data/h5/type=raw
  analysis_dir: data/example/analysis

  # h5 dark frame
  raw_dark_dir: data/example/raw_data/h5/type=raw/run=002/scan=001
  # saved npz dark frame
  save_dark_dir: ${path.analysis_dir}/dark_images/dark.npy

  output_dir: ${path.analysis_dir}/output_data
  mat_dir: ${path.analysis_dir}/mat_files
  processed_dir: ${path.analysis_dir}/processed_data

param:
  merge_num: 7
  chunk_size: 100
  pump_setting: 60HZ
  hutch: eh1
  detector: jungfrau2
  xray: HX
  y1: 0
  y2: 1
  x1: 2
  x2: 3
  sdd: 1.3
  dps: 7.5e-05
  beam_energy: 9
