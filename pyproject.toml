[project]
name = "qoraflow"
version = "0.1.1"
description = "Data-processing toolkit for time-resolved ultrafast X-ray experiments at PAL-XFEL"
readme = "README.md"
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.11"
dependencies = [
    'PyYAML',
    'click',
    'h5py',
    'hdf5plugin',
    "ipykernel",
    'jupyter',
    'lmfit',
    'loguru',
    'matplotlib',
    'numpy',
    'pandas',
    'pydantic',
    "pyqt6",
    'radon',
    'roi-rectangle',
    'scikit-image',
    'scikit_learn',
    'scipy',
    'tables',
    'tifffile',
    'tqdm',
    'tuna',
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/QoraFlow"
Repository = "https://github.com/NaNIsaac/QoraFlow"

[dependency-groups]
dev = [
    "memory-profiler",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"notebooks/24_12_10/2D_visualization_example.ipynb" = ["F821"]
